name: Demo report

# Manual only (Actions tab -> Demo report -> Run workflow). It rebuilds the demo report from
# the pinned versions in requirements.lock and publishes it on GitHub Pages. It does not run
# on push, so a finished project makes no scheduled or automatic runs.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install system libraries for Open3D
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libgomp1

      - name: Install package (pinned, CPU PyTorch)
        run: pip install -c requirements.lock -e . --extra-index-url https://download.pytorch.org/whl/cpu

      - name: Run the demo (synthetic room, every kind of change)
        run: freespace demo --no-open | tee demo.log

      - name: Collect the site
        run: |
          mkdir site
          cp out/demo/report.html site/index.html
          cp out/demo/changes.json site/changes.json
          touch site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
